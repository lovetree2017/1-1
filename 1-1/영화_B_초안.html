<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영화 티어리스트</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: #f7f8fb;
      color: #222;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .add-area {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 220px;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    button.secondary {
      background: #eef2ff;
      color: #3730a3;
    }

    button.secondary:hover {
      background: #e0e7ff;
    }

    button.danger {
      background: #ef4444;
    }

    button.danger:hover {
      background: #dc2626;
    }

    button.gray {
      background: #e5e7eb;
      color: #111827;
    }

    button.gray:hover {
      background: #d1d5db;
    }

    .selected-area {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 4px;
      border-top: 1px solid #f0f0f0;
    }

    .selected-text {
      margin-right: 6px;
      font-size: 14px;
      color: #555;
    }

    .selected-name {
      font-weight: 800;
      color: #111;
    }

    .tier-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }

    .tier-row {
      display: grid;
      grid-template-columns: 90px 1fr;
      min-height: 92px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.035);
    }

    .tier-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      color: #111;
    }

    .tier-s .tier-label {
      background: #fecaca;
    }

    .tier-a .tier-label {
      background: #fed7aa;
    }

    .tier-b .tier-label {
      background: #fef08a;
    }

    .tier-c .tier-label {
      background: #bbf7d0;
    }

    .dropzone {
      display: flex;
      align-content: flex-start;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px;
      min-height: 92px;
      background: #ffffff;
    }

    .dropzone.drag-over {
      background: #eff6ff;
      outline: 2px dashed #60a5fa;
      outline-offset: -6px;
    }

    .unplaced-section {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.035);
    }

    .unplaced-title {
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 900;
      background: #f9fafb;
    }

    .movie-card {
      user-select: none;
      padding: 10px 13px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
      font-weight: 700;
      cursor: grab;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: 0.15s;
      max-width: 100%;
    }

    .movie-card:hover {
      transform: translateY(-2px);
      border-color: #93c5fd;
    }

    .movie-card.selected {
      background: #dbeafe;
      border-color: #2563eb;
      color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .empty-message {
      color: #9ca3af;
      font-size: 14px;
      padding: 8px;
    }

    .notice {
      margin-top: 14px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .tier-row {
        grid-template-columns: 64px 1fr;
      }

      .tier-label {
        font-size: 24px;
      }

      button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>영화 티어리스트</h1>
    <p>영화를 드래그하거나 버튼으로 S / A / B / C 티어에 배치해 보세요.</p>
  </header>

  <main>
    <section class="toolbar">
      <div class="add-area">
        <input id="movieInput" type="text" placeholder="추가할 영화 제목을 입력하세요" />
        <button id="addBtn">영화 추가</button>
        <button id="saveImageBtn" class="secondary">이미지로 저장</button>
        <button id="resetBtn" class="gray">초기화</button>
      </div>

      <div class="selected-area">
        <span class="selected-text">
          선택한 영화:
          <span id="selectedName" class="selected-name">없음</span>
        </span>
        <button data-move="S">S로 배치</button>
        <button data-move="A">A로 배치</button>
        <button data-move="B">B로 배치</button>
        <button data-move="C">C로 배치</button>
        <button data-move="unplaced" class="gray">미배치로 이동</button>
        <button id="deleteBtn" class="danger">삭제</button>
      </div>
    </section>

    <section class="tier-list" id="tierList">
      <div class="tier-row tier-s">
        <div class="tier-label">S</div>
        <div class="dropzone" data-tier="S"></div>
      </div>

      <div class="tier-row tier-a">
        <div class="tier-label">A</div>
        <div class="dropzone" data-tier="A"></div>
      </div>

      <div class="tier-row tier-b">
        <div class="tier-label">B</div>
        <div class="dropzone" data-tier="B"></div>
      </div>

      <div class="tier-row tier-c">
        <div class="tier-label">C</div>
        <div class="dropzone" data-tier="C"></div>
      </div>
    </section>

    <section class="unplaced-section">
      <div class="unplaced-title">미배치 영화 목록</div>
      <div class="dropzone" data-tier="unplaced"></div>
    </section>

    <p class="notice">
      안내: 영화 카드를 클릭하면 선택됩니다. 선택한 뒤 버튼으로 배치하거나, 카드를 직접 드래그 앤 드롭할 수 있습니다.
      배치 결과는 브라우저 저장소에 자동 저장됩니다.
    </p>
  </main>

  <script>
    const STORAGE_KEY = "movie-tier-list-data-v1";

    const initialMovies = [
      { id: "movie-1", title: "기생충", tier: "unplaced" },
      { id: "movie-2", title: "인터스텔라", tier: "unplaced" },
      { id: "movie-3", title: "라라랜드", tier: "unplaced" },
      { id: "movie-4", title: "센과 치히로의 행방불명", tier: "unplaced" },
      { id: "movie-5", title: "어벤져스: 엔드게임", tier: "unplaced" },
      { id: "movie-6", title: "범죄도시", tier: "unplaced" },
      { id: "movie-7", title: "타이타닉", tier: "unplaced" },
      { id: "movie-8", title: "토이 스토리", tier: "unplaced" }
    ];

    let movies = loadMovies();
    let selectedMovieId = null;

    const movieInput = document.getElementById("movieInput");
    const addBtn = document.getElementById("addBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const saveImageBtn = document.getElementById("saveImageBtn");
    const resetBtn = document.getElementById("resetBtn");
    const selectedName = document.getElementById("selectedName");
    const dropzones = document.querySelectorAll(".dropzone");
    const moveButtons = document.querySelectorAll("[data-move]");

    render();

    addBtn.addEventListener("click", addMovie);

    movieInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        addMovie();
      }
    });

    deleteBtn.addEventListener("click", deleteSelectedMovie);

    moveButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const targetTier = button.dataset.move;
        moveSelectedMovie(targetTier);
      });
    });

    saveImageBtn.addEventListener("click", saveAsImage);

    resetBtn.addEventListener("click", () => {
      const ok = confirm("초기 상태로 되돌릴까요? 저장된 배치 결과가 삭제됩니다.");
      if (!ok) return;

      movies = structuredClone(initialMovies);
      selectedMovieId = null;
      saveMovies();
      render();
    });

    dropzones.forEach((zone) => {
      zone.addEventListener("dragover", (event) => {
        event.preventDefault();
        zone.classList.add("drag-over");
      });

      zone.addEventListener("dragleave", () => {
        zone.classList.remove("drag-over");
      });

      zone.addEventListener("drop", (event) => {
        event.preventDefault();
        zone.classList.remove("drag-over");

        const movieId = event.dataTransfer.getData("text/plain");
        const targetTier = zone.dataset.tier;

        moveMovie(movieId, targetTier);
      });
    });

    function loadMovies() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          return structuredClone(initialMovies);
        }

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) {
          return structuredClone(initialMovies);
        }

        return parsed;
      } catch (error) {
        return structuredClone(initialMovies);
      }
    }

    function saveMovies() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
    }

    function render() {
      dropzones.forEach((zone) => {
        zone.innerHTML = "";
      });

      const tiers = ["S", "A", "B", "C", "unplaced"];

      tiers.forEach((tier) => {
        const zone = document.querySelector(`[data-tier="${tier}"]`);
        const tierMovies = movies.filter((movie) => movie.tier === tier);

        if (tierMovies.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-message";
          empty.textContent = tier === "unplaced"
            ? "미배치 영화가 없습니다."
            : "이 티어에 영화를 놓아보세요.";
          zone.appendChild(empty);
          return;
        }

        tierMovies.forEach((movie) => {
          const card = createMovieCard(movie);
          zone.appendChild(card);
        });
      });

      updateSelectedText();
    }

    function createMovieCard(movie) {
      const card = document.createElement("div");
      card.className = "movie-card";
      card.textContent = movie.title;
      card.draggable = true;
      card.dataset.id = movie.id;

      if (movie.id === selectedMovieId) {
        card.classList.add("selected");
      }

      card.addEventListener("click", () => {
        selectedMovieId = movie.id;
        render();
      });

      card.addEventListener("dragstart", (event) => {
        selectedMovieId = movie.id;
        event.dataTransfer.setData("text/plain", movie.id);
        event.dataTransfer.effectAllowed = "move";
      });

      return card;
    }

    function addMovie() {
      const title = movieInput.value.trim();

      if (!title) {
        alert("영화 제목을 입력해 주세요.");
        return;
      }

      const newMovie = {
        id: "movie-" + Date.now(),
        title,
        tier: "unplaced"
      };

      movies.push(newMovie);
      selectedMovieId = newMovie.id;
      movieInput.value = "";

      saveMovies();
      render();
    }

    function deleteSelectedMovie() {
      if (!selectedMovieId) {
        alert("삭제할 영화를 먼저 선택해 주세요.");
        return;
      }

      const selectedMovie = movies.find((movie) => movie.id === selectedMovieId);
      if (!selectedMovie) return;

      const ok = confirm(`"${selectedMovie.title}" 영화를 삭제할까요?`);
      if (!ok) return;

      movies = movies.filter((movie) => movie.id !== selectedMovieId);
      selectedMovieId = null;

      saveMovies();
      render();
    }

    function moveSelectedMovie(targetTier) {
      if (!selectedMovieId) {
        alert("배치할 영화를 먼저 선택해 주세요.");
        return;
      }

      moveMovie(selectedMovieId, targetTier);
    }

    function moveMovie(movieId, targetTier) {      const movie = movies.find((item) => item.id === movieId);

      if (!movie) {
        return;
      }

      movie.tier = targetTier;
      selectedMovieId = movieId;

      saveMovies();
      render();
    }

    function updateSelectedText() {
      const selectedMovie = movies.find((movie) => movie.id === selectedMovieId);

      if (!selectedMovie) {
        selectedName.textContent = "없음";
        return;
      }

      selectedName.textContent = selectedMovie.title;
    }

    function saveAsImage() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const width = 1200;
      const rowHeight = 150;
      const headerHeight = 90;
      const bottomPadding = 50;
      const tiers = ["S", "A", "B", "C", "unplaced"];
      const height = headerHeight + rowHeight * tiers.length + bottomPadding;

      canvas.width = width;
      canvas.height = height;

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "#111827";
      ctx.font = "bold 34px sans-serif";
      ctx.fillText("영화 티어리스트", 40, 55);

      ctx.font = "16px sans-serif";
      ctx.fillStyle = "#6b7280";
      ctx.fillText("S / A / B / C 티어 배치 결과", 40, 80);

      const labelColors = {
        S: "#fecaca",
        A: "#fed7aa",
        B: "#fef08a",
        C: "#bbf7d0",
        unplaced: "#e5e7eb"
      };

      const labelTexts = {
        S: "S",
        A: "A",
        B: "B",
        C: "C",
        unplaced: "미배치"
      };

      tiers.forEach((tier, index) => {
        const y = headerHeight + index * rowHeight;
        const labelWidth = 150;
        const rowX = 40;
        const rowWidth = width - 80;

        ctx.fillStyle = "#f9fafb";
        drawRoundRect(ctx, rowX, y + 10, rowWidth, rowHeight - 16, 18);
        ctx.fill();

        ctx.strokeStyle = "#e5e7eb";
        ctx.lineWidth = 2;
        drawRoundRect(ctx, rowX, y + 10, rowWidth, rowHeight - 16, 18);
        ctx.stroke();

        ctx.fillStyle = labelColors[tier];
        drawRoundRect(ctx, rowX, y + 10, labelWidth, rowHeight - 16, 18);
        ctx.fill();

        ctx.fillStyle = "#111827";
        ctx.font = tier === "unplaced" ? "bold 26px sans-serif" : "bold 46px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(labelTexts[tier], rowX + labelWidth / 2, y + rowHeight / 2);

        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";

        const tierMovies = movies.filter((movie) => movie.tier === tier);

        if (tierMovies.length === 0) {
          ctx.fillStyle = "#9ca3af";
          ctx.font = "18px sans-serif";
          ctx.fillText(
            tier === "unplaced" ? "미배치 영화가 없습니다." : "이 티어에 배치된 영화가 없습니다.",
            rowX + labelWidth + 25,
            y + 80
          );
          return;
        }

        let cardX = rowX + labelWidth + 22;
        let cardY = y + 35;
        const maxX = rowX + rowWidth - 30;

        tierMovies.forEach((movie) => {
          const cardWidth = Math.min(260, Math.max(120, ctx.measureText(movie.title).width + 42));
          const cardHeight = 42;

          if (cardX + cardWidth > maxX) {
            cardX = rowX + labelWidth + 22;
            cardY += 52;
          }

          ctx.fillStyle = "#ffffff";
          drawRoundRect(ctx, cardX, cardY, cardWidth, cardHeight, 21);
          ctx.fill();

          ctx.strokeStyle = "#d1d5db";
          ctx.lineWidth = 2;
          drawRoundRect(ctx, cardX, cardY, cardWidth, cardHeight, 21);
          ctx.stroke();

          ctx.fillStyle = "#111827";
          ctx.font = "bold 17px sans-serif";
          ctx.fillText(shortenText(ctx, movie.title, cardWidth - 32), cardX + 16, cardY + 27);

          cardX += cardWidth + 12;
        });
      });

      const imageUrl = canvas.toDataURL("image/png");

      const link = document.createElement("a");
      link.href = imageUrl;
      link.download = "영화_티어리스트.png";
      link.click();
    }

    function drawRoundRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);

      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function shortenText(ctx, text, maxWidth) {
      if (ctx.measureText(text).width <= maxWidth) {
        return text;
      }

      let shortened = text;

      while (shortened.length > 0 && ctx.measureText(shortened + "...").width > maxWidth) {
        shortened = shortened.slice(0, -1);
      }

      return shortened + "...";
    }
  </script>
</body>
</html>
